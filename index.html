<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Checklist Tareas - Edificio StF</title>
    
    <!-- Configuración para App Móvil (PWA) / Pantalla de Inicio -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tareas StF">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Librería externa para exportar a PDF de forma limpia -->
    <script src="https://cloudflare.com"></script>

    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --header-bg: #000000;
            --header-text: #ffffff;
            --border-color: #dddddd;
            --accent-color: #007aff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            padding-top: env(safe-area-inset-top, 15px);
        }

        .container {
            max-width: 100%;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 15px;
        }

        .wrapper-table {
            overflow-x: auto;
            width: 100%;
        }

        .main-header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 12px;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            border-radius: 4px 4px 0 0;
        }

        .sub-header {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-left: 5px;
        }

        .actions-bar {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            opacity: 0.8;
        }

        /* Tabla Responsiva */
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px; 
        }

        th {
            background-color: var(--header-bg);
            color: var(--header-text);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 8px;
            text-align: left;
            border: 1px solid var(--border-color);
        }

        th div {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-select {
            width: 100%;
            padding: 4px;
            font-size: 0.75rem;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #222;
            color: #fff;
        }

        td {
            padding: 10px 8px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        td input, td select {
            width: 100%;
            border: 1px solid transparent;
            background: transparent;
            padding: 4px;
            font-size: 0.9rem;
            color: var(--text-color);
            border-radius: 4px;
        }

        td input:focus, td select:focus {
            border-color: var(--accent-color);
            background-color: #fff;
            outline: none;
        }

        .btn-delete {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Estilos específicos y limpios para cuando se genera el PDF */
        .pdf-mode .actions-bar, 
        .pdf-mode .btn-delete, 
        .pdf-mode th style,
        .pdf-mode td:last-child, 
        .pdf-mode th:last-child,
        .pdf-mode .filter-select {
            display: none !important;
        }
        
        .pdf-mode .container {
            box-shadow: none;
            padding: 0;
        }

        .pdf-mode table {
            width: 100% !important;
            min-width: 100% !important;
        }

        .pdf-mode td input, .pdf-mode td select {
            border: none !important;
            background: transparent !important;
            appearance: none;
            -webkit-appearance: none;
        }
    </style>
</head>
<body>

    <div class="container" id="dashboard">
        <div class="main-header">Checklist Tareas</div>
        <div class="sub-header">OBRA: Edificio StF</div>

        <div class="actions-bar">
            <button class="btn" onclick="addNewRow()">➕ Agregar Renglón</button>
            <button class="btn" style="background-color: #34c759;" onclick="saveData()">💾 Guardar Cambios</button>
            <button class="btn" style="background-color: #5856d6;" onclick="exportToPDF()">📄 Compartir PDF</button>
        </div>

        <div class="wrapper-table">
            <table id="taskTable">
                <thead>
                    <tr>
                        <th><div>FECHA <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th><div>TAREA <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th><div>PISO <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th><div>UNIDAD <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th><div>AMBIENTE <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th><div>EJECUTADO <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th><div>RUBRO <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th><div>CONTRATISTA <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th style="width: 80px; text-align: center;">Acción</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const defaultData = [
            { fecha: '2026-10-09', tarea: 'Ejecutar cierres espacios técnicos', piso: '6', unidad: 'A', ambiente: 'General', ejecutado: 'SI', rubro: 'Albañilería', contratista: 'Chacal' }
        ];

        let tableData = JSON.parse(localStorage.getItem('stf_dashboard_data')) || defaultData;

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            tableData.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="date" value="${row.fecha}" onchange="updateValue(${index}, 'fecha', this.value)"></td>
                    <td><input type="text" value="${row.tarea}" onchange="updateValue(${index}, 'tarea', this.value)"></td>
                    <td><input type="text" value="${row.piso}" onchange="updateValue(${index}, 'piso', this.value)"></td>
                    <td><input type="text" value="${row.unidad}" onchange="updateValue(${index}, 'unidad', this.value)"></td>
                    <td><input type="text" value="${row.ambiente}" onchange="updateValue(${index}, 'ambiente', this.value)"></td>
                    <td>
                        <select onchange="updateValue(${index}, 'ejecutado', this.value)">
                            <option value="SI" ${row.ejecutado === 'SI' ? 'selected' : ''}>SI</option>
                            <option value="NO" ${row.ejecutado === 'NO' ? 'selected' : ''}>NO</option>
                        </select>
                    </td>
                    <td><input type="text" value="${row.rubro}" onchange="updateValue(${index}, 'rubro', this.value)"></td>
                    <td><input type="text" value="${row.contratista}" onchange="updateValue(${index}, 'contratista', this.value)"></td>
                    <td style="text-align:center;"><button class="btn-delete" onclick="deleteRow(${index})">Borrar</button></td>
                `;
                tbody.appendChild(tr);
            });

            updateFilterOptions();
        }

        function updateValue(index, field, value) {
            tableData[index][field] = value;
        }

        function addNewRow() {
            tableData.push({ fecha: '', tarea: '', piso: '', unidad: '', ambiente: '', ejecutado: 'NO', rubro: '', contratista: '' });
            renderTable();
        }

        function deleteRow(index) {
            tableData.splice(index, 1);
            renderTable();
            saveData();
        }
