<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checklist Tareas - Edificio StF</title>
    
    <!-- Configuración para Pantalla de Inicio (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="3dF Obras">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Ícono de la App (Logotipo 3dF Desarrollos) -->
    <link rel="apple-touch-icon" href="https://ibb.co">
    <link rel="icon" type="image/png" href="https://ibb.co">

    <!-- Librería para exportar PDF -->
    <script src="https://cloudflare.com"></script>

    <style>
        :root {
            --primary-color: #000000;
            --light-bg: #f4f6f9;
            --border-color: #cccccc;
            --text-color: #333333;
            --filter-bg: #eaeaea;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-color);
            padding: 15px;
            padding-top: env(safe-area-inset-top, 15px);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Cabecera con Logo */
        .header-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .title-area h1 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .title-area p {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        .logo-area img {
            height: 55px;
            width: auto;
            display: block;
        }

        /* Controles Operativos */
        .controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.8; }
        .btn-add { background-color: #28a745; color: white; }
        .btn-pdf { background-color: #007bff; color: white; }
        .btn-reset { background-color: #dc3545; color: white; margin-left: auto; }

        /* Estructura Robusta de Tabla Libre de Superposiciones */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 25px;
            background: #ffffff;
        }

        table {
            width: 100%;
            min-width: 950px;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-size: 12px;
            text-transform: uppercase;
            padding: 12px 8px;
            text-align: left;
            font-weight: 600;
        }

        /* Fila del Menú de Filtros por Columna */
        .filter-row {
            background-color: var(--filter-bg);
        }

        .filter-row td {
            padding: 6px 4px;
            border-bottom: 2px solid var(--border-color);
        }

        .filter-select {
            width: 100%;
            padding: 6px;
            font-size: 12px;
            border: 1px solid #b5b5b5;
            border-radius: 3px;
            background-color: #fff;
            color: #333;
            font-weight: 500;
        }

        /* Anchos de Columna Proporcionales Estrictos */
        th:nth-child(1), td:nth-child(1) { width: 12%; } /* Fecha */
        th:nth-child(2), td:nth-child(2) { width: 30%; } /* Tarea */
        th:nth-child(3), td:nth-child(3) { width: 8%; }  /* Piso */
        th:nth-child(4), td:nth-child(4) { width: 9%; }  /* Unidad */
        th:nth-child(5), td:nth-child(5) { width: 14%; } /* Ambiente */
        th:nth-child(6), td:nth-child(6) { width: 11%; } /* Ejecutado */
        th:nth-child(7), td:nth-child(7) { width: 12%; } /* Rubro */
        th:nth-child(8), td:nth-child(8) { width: 4%; }  /* Acción */

        td {
            border-bottom: 1px solid var(--border-color);
            padding: 4px;
            vertical-align: middle;
        }

        .cell-input {
            width: 100%;
            padding: 8px;
            border: 1px solid transparent;
            background: transparent;
            font-size: 13px;
            color: var(--text-color);
            border-radius: 4px;
        }

        .cell-input:focus {
            background-color: #ffffff;
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 3px rgba(0,123,255,0.3);
        }

        .btn-delete {
            background: none;
            border: none;
            color: #dc3545;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        /* Bloque de Personal / Contratistas */
        .contractor-section {
            margin-top: 20px;
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
        }

        .contractor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: #fafafa;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .contractor-box label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
        }

        /* Estilos de Impresión Limpios */
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; background: white; }
            .container { box-shadow: none; padding: 0; }
            .filter-row { display: none !important; }
            .cell-input { border: none !important; background: transparent !important; }
        }
    </style>
</head>
<body>

<div class="container" id="dashboard-content">
    
    <!-- Encabezado con Identidad Corporativa -->
    <header class="header-layout">
        <div class="title-area">
            <h1>Checklist Tareas</h1>
            <p><strong>OBRA:</strong> <span contenteditable="true" id="obra-name">Edificio StF</span></p>
        </div>
        <div class="logo-area">
            <img src="https://ibb.co" alt="3dF Desarrollos">
        </div>
    </header>

    <!-- Barra de Controles Operativos -->
    <div class="controls-row no-print">
        <button class="btn btn-add" onclick="addNewRow()">➕ Agregar Renglón</button>
        <button class="btn btn-pdf" onclick="exportToPDF()">📄 Exportar PDF</button>
        <button class="btn btn-reset" onclick="resetDashboard()">🔄 Resetear Todo</button>
    </div>

    <!-- Contenedor Interactivo Principal -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Tarea</th>
                    <th>Piso</th>
                    <th>Unidad</th>
                    <th>Ambiente</th>
                    <th>Ejecutado</th>
                    <th>Rubro</th>
                    <th class="no-print"></th>
                </tr>
                <!-- FILA DE FILTROS DESPLEGABLES ASOCIADOS A LOS CAMPOS CARGADOS -->
                <tr class="filter-row no-print">
                    <td><select id="sf-fecha" class="filter-select" onchange="applyMulticriteriaFilter()"><option value="all">Ver todos</option></select></td>
                    <td><select id="sf-tarea" class="filter-select" onchange="applyMulticriteriaFilter()"><option value="all">Ver todos</option></select></td>
                    <td><select id="sf-piso" class="filter-select" onchange="applyMulticriteriaFilter()"><option value="all">Ver todos</option></select></td>
                    <td><select id="sf-unidad" class="filter-select" onchange="applyMulticriteriaFilter()"><option value="all">Ver todos</option></select></td>
                    <td><select id="sf-ambiente" class="filter-select" onchange="applyMulticriteriaFilter()"><option value="all">Ver todos</option></select></td>
                    <td><select id="sf-ejecutado" class="filter-select" onchange="applyMulticriteriaFilter()"><option value="all">Ver todos</option></select></td>
                    <td><select id="sf-rubro" class="filter-select" onchange="applyMulticriteriaFilter()"><option value="all">Ver todos</option></select></td>
                    <td></td>
                </tr>
            </thead>
            <tbody id="tareas-body">
                <!-- Inyección mediante JS -->
            </tbody>
        </table>
    </div>

    <!-- Módulo Control Personal -->
    <div class="contractor-section">
        <div class="contractor-grid">
