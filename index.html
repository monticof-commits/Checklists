<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Checklist Tareas - Edificio StF</title>
    
    <!-- Configuración para Web App en iPhone (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tareas StF">
    
    <!-- LOGO DE LA EMPRESA COMO ÍCONO DE PANTALLA DE INICIO -->
    <!-- Reemplazá 'logo_3df.png' por el nombre exacto de la imagen del logo subida a tu GitHub -->
    <link rel="apple-touch-icon" href="logo_3df.png">
    <link rel="icon" type="image/png" href="logo_3df.png">

    <!-- Librería para exportar a PDF -->
    <script src="https://cloudflare.com"></script>

    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #111111;
            --header-bg: #000000;
            --header-text: #ffffff;
            --border-color: #cccccc;
            --accent-color: #007aff;
            --si-color: #d1e7dd;
            --no-color: #f8d7da;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            padding-top: env(safe-area-inset-top, 15px);
        }

        .container {
            max-width: 100%;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            padding: 15px;
        }

        .top-meta-block {
            display: flex;
            justify-content: space-between;
            background: var(--header-bg);
            color: var(--header-text);
            padding: 12px;
            font-weight: bold;
            border-radius: 6px 6px 0 0;
        }

        .main-title {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .right-meta {
            text-align: right;
            font-size: 0.75rem;
            line-height: 1.3;
            font-weight: normal;
        }

        .sub-header {
            font-size: 1rem;
            font-weight: 700;
            margin: 12px 0 20px 5px;
        }

        .actions-bar {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn:active { opacity: 0.8; }

        .wrapper-table {
            overflow-x: auto;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px; 
        }

        th {
            background-color: var(--header-bg);
            color: var(--header-text);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 8px;
            text-align: left;
            border: 1px solid var(--border-color);
        }

        th div {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-select {
            width: 100%;
            padding: 4px;
            font-size: 0.75rem;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #222;
            color: #fff;
        }

        td {
            padding: 8px 6px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            vertical-align: middle;
        }

        td input, td select {
            width: 100%;
            border: 1px solid transparent;
            background: transparent;
            padding: 6px 4px;
            font-size: 0.85rem;
            color: var(--text-color);
            border-radius: 4px;
        }

        td input:focus, td select:focus {
            border-color: var(--accent-color);
            background-color: #fff;
            outline: none;
        }

        /* Estilos de estado para Ejecutado */
        .status-si { background-color: var(--si-color) !important; font-weight: bold; }
        .status-no { background-color: var(--no-color) !important; font-weight: bold; }

        .btn-delete {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Formateo de impresión limpio para el PDF de WhatsApp */
        .pdf-mode .actions-bar, 
        .pdf-mode .btn-delete, 
        .pdf-mode td:last-child, 
        .pdf-mode th:last-child,
        .pdf-mode .filter-select {
            display: none !important;
        }
        
        .pdf-mode .container { box-shadow: none; padding: 0; }
        .pdf-mode table { width: 100% !important; min-width: 100% !important; }
        .pdf-mode td input, .pdf-mode td select { border: none !important; background: transparent !important; appearance: none; -webkit-appearance: none; }
    </style>
</head>
<body>

    <div class="container" id="dashboard">
        <div class="top-meta-block">
            <div class="main-title">Checklist Tareas</div>
            <div class="right-meta">
                <div>R-D00-P17</div>
                <div>VERSIÓN: 1</div>
                <div>FECHA: 20/01/2026</div>
            </div>
        </div>
        <div class="sub-header">OBRA: Edificio StF</div>

        <div class="actions-bar">
            <button class="btn" onclick="addNewRow()">➕ Agregar Renglón</button>
            <button class="btn" style="background-color: #34c759;" onclick="saveData(true)">💾 Guardar Cambios</button>
            <button class="btn" style="background-color: #5856d6;" onclick="exportToPDF()">📄 Compartir PDF</button>
        </div>

        <div class="wrapper-table">
            <table id="taskTable">
                <thead>
                    <tr>
                        <th><div>FECHA <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th><div>TAREA <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th><div>PISO <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th><div>UNIDAD <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th><div>AMBIENTE <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th><div>EJECUTADO <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th><div>RUBRO <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th><div>CONTRATISTA <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th><div>INGRESADO <select class="filter-select" onchange="filterTable()"><option value="all">Todo</option></select></div></th>
                        <th style="width: 80px; text-align: center;">Acción</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Set de datos iniciales exactos de la imagen
        const initialData = [
            { fecha: '2026-10-09', tarea: 'Ejecutar cierres espacios técnicos', piso: '6', unidad: 'A', ambiente: 'General', ejecutado: 'SI', rubro: 'Albañilería', contratista: 'Chacal', ingresado: 'Coordinador de Obra' },
            { fecha: '2026-10-06', tarea: 'Falta colocar premarco', piso: '6', unidad: 'A', ambiente: 'Baño suite', ejecutado: 'NO', rubro: 'Albañilería', contratista: 'Chacal', ingresado: 'Coordinador de Obra' },
            { fecha: '2026-10-06', tarea: 'Falta aplique arco de H°', piso: '6', unidad: 'A', ambiente: 'Balcón', ejecutado: 'NO', rubro: 'Inst. Eléctrica', contratista: 'Canavesio', ingresado: 'Coordinador de Obra' },
            { fecha: '2026-10-06', tarea: 'Falta contrapiso balcones', piso: '6', unidad: 'A', ambiente: 'Balcones', ejecutado: 'NO', rubro: 'Albañilería', contratista: 'Chacal', ingresado: 'Coordinador de Obra' }
        ];

        let tableData = JSON.parse(localStorage.getItem('stf_dashboard_data_v2')) || initialData;

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            tableData.forEach((row, index) => {
                const tr = document.createElement('tr');
                
                // Formatear fecha para el input type="date" (YYYY-MM-DD)
                let dateValue = row.fecha;
                if(dateValue && dateValue.includes('/')) {
                    const parts = dateValue.split('/');
                    dateValue = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
                }

                tr.innerHTML = `
